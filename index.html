        // Random Selection
        const selectedTheme = themes[Math.floor(Math.random() * themes.length)];
        
        // Apply Variables
        const root = document.documentElement;
        for (const [key, value] of Object.entries(selectedTheme.vars)) {
            root.style.setProperty(key, value);
        }
        console.log("Applied Theme:", selectedTheme.name);

    <style>
        :root {
            /* Fallbacks */
            --bg-main: #0F172A;
            --text-main: #f8fafc;
            --text-sec: #94a3b8;
            --accent: #8B5CF6;
            --accent-hover: #7c3aed;
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(139, 92, 246, 0.2);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(51, 65, 85, 0.8);
            --blob-1: #7c3aed;
            --blob-2: #db2777;
            --blob-3: #4f46e5;
            --special-bg: rgba(236, 72, 153, 0.1);
            --special-border: rgba(236, 72, 153, 0.5);
            --special-text: #ec4899;
            --special-btn: #db2777;
        }

        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- Theme Utility Classes --- */
        .theme-text-main { color: var(--text-main); }
        .theme-text-sec { color: var(--text-sec); }
        .theme-text-accent { color: var(--accent); }
        
        .theme-btn {
            background-color: var(--accent);
            color: #fff;
        }
        .theme-btn:hover { background-color: var(--accent-hover); }

        /* Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite ease-in-out alternate;
            transition: background-color 1s ease;
        }
        .blob-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: var(--blob-1); animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 300px; height: 300px; background: var(--blob-2); animation-delay: -5s; opacity: 0.3; }
        .blob-3 { top: 40%; left: 40%; width: 200px; height: 200px; background: var(--blob-3); animation-delay: -2s; transform: translate(-50%, -50%); opacity: 0.3; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 40px) scale(1.1); }
        }

        /* Gradient Title */
        .text-gradient-anim {
            background: linear-gradient(270deg, var(--accent), var(--blob-2), var(--accent));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 8s ease infinite;
            filter: drop-shadow(0 0 5px var(--glass-border));
        }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
        }

        /* Profile Image */
        .profile-ring {
            position: relative;
            padding: 4px;
            background: linear-gradient(45deg, var(--accent), var(--special-btn));
            border-radius: 50%;
            display: inline-block;
        }
        .profile-img {
            background-color: var(--card-hover);
            border: 4px solid var(--bg-main);
        }

        /* Action Cards */
        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .action-card:hover {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px -5px var(--glass-border);
        }
        .action-card:active {
            transform: scale(0.98);
        }

        /* Special Card (Watch) */
        .special-card {
            background: var(--special-bg);
            border: 1px solid var(--special-border);
        }
        .special-card:hover {
            filter: brightness(1.2);
            border-color: var(--special-text);
        }
        .special-icon-box {
            border-color: var(--special-text);
        }
        .special-title { color: var(--special-text); }
        .special-desc { color: var(--special-text); opacity: 0.8; }
        .special-btn {
            background-color: var(--special-btn);
            color: #fff;
            box-shadow: 0 0 15px var(--special-border);
        }
        .special-btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 25px var(--special-border);
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        /* Icon Styling */
        .icon-box {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            transition: all 0.3s ease;
        }
        .group:hover .icon-box {
            background: rgba(255,255,255,0.2);
            border-color: var(--accent);
            transform: scale(1.1) rotate(5deg);
        }
        .icon-box svg {
            color: var(--accent);
        }
        
        /* Dynamic text highlighting with intense pulse */
        .highlight-text {
            color: #ffffff !important;
            background: linear-gradient(90deg, #ef4444, #f97316) !important;
            padding: 4px 10px !important;
            border-radius: 12px !important;
            font-weight: 800 !important;
            font-size: 11px !important;
            letter-spacing: 0.5px !important;
            opacity: 1 !important;
            display: inline-block !important;
            margin-top: 6px !important;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4) !important;
            animation: pulse-alert 0.8s infinite alternate !important;
        }

        @keyframes pulse-alert {
            0% { transform: scale(1); box-shadow: 0 0 5px rgba(239, 68, 68, 0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 15px rgba(239, 68, 68, 0.9); }
        }
    </style>
</head>

            if (waProfileNameEl) waProfileNameEl.innerText = currentData.waName;

            document.querySelectorAll('.page-link').forEach(link => {
                const href = link.getAttribute('href');

            // Fetch the URL based on the current page context
            const targetUrl = currentData.links[type];
